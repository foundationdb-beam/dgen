<svg viewBox="0 0 1044 738" width="1044" role="img" aria-label="An unregister deletes the local row at once and is committed by the leader. When a registered process exits, the leader&#x27;s tagged monitor turns the exit into the same unregister batch." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--fg:#1a2226;--muted:#5a676d;--rule:#c9d2d5;--lane:#e6ecee;
--accent:#0a6a86;--durable:#8c5a06;--warn:#b0281f;--note:#f8f4e6;--note-rule:#c9b98a}
@media (prefers-color-scheme: dark){:root{--surface:#172024;--fg:#e1e8ea;--muted:#97a5ab;
--rule:#33424a;--lane:#1e2a30;--accent:#56c2df;--durable:#e2ab52;--warn:#ff8074;
--note:#23241d;--note-rule:#6d6440}}
.bg{fill:var(--surface)}
.leg-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;fill:var(--fg)}
.life{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.lane-head{fill:var(--lane);stroke:var(--rule)}
.lane-n{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:13.5px;fill:var(--fg)}
.lane-s,.lbl,.phase-t,.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lane-s{font-size:10.5px;fill:var(--muted)}
.ln{stroke-width:1.4;fill:none}
.lbl{font-size:11px;paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.m-cast,.m-call{stroke:var(--fg);fill:var(--fg)}
.m-reply{stroke:var(--muted);fill:var(--muted)}
.ln.m-reply{stroke-dasharray:5 4}
.m-db{stroke:var(--durable);fill:var(--durable)}
.ln.m-db{stroke-dasharray:1.5 3;stroke-width:1.8;stroke-linecap:round}
.m-signal{stroke:var(--warn);fill:var(--warn)}
.accent{stroke:var(--accent);fill:var(--accent)}
.ln.accent{stroke-width:2.2}
.lbl{stroke:var(--surface)}
.lbl.accent{font-weight:600}
.head,.dot{stroke:none}
.lost{stroke:var(--warn);stroke-width:2;fill:none;stroke-linecap:round}
.act{fill:var(--surface);stroke:var(--rule)}
.act.warn{stroke:var(--warn)}
.act-t,.note-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11.5px;fill:var(--fg)}
.act-t.warn{fill:var(--warn)}
.note{fill:var(--note);stroke:var(--note-rule);stroke-dasharray:4 3}
.note-t{font-style:italic}
.phase-ln{stroke:var(--rule);stroke-width:1}
.phase-bg{fill:var(--surface)}
.phase-t{font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.num-dot{fill:none;stroke:var(--rule)}
.num{font-size:10px;fill:var(--muted)}
</style><rect class="bg" width="100%" height="100%"/>
<line class="life" x1="123.0" y1="52" x2="123.0" y2="732"/>
<rect class="lane-head" x="48.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="123.0" y="24" text-anchor="middle">Caller</text><text class="lane-s" x="123.0" y="40" text-anchor="middle">any process</text>
<line class="life" x1="289.0" y1="52" x2="289.0" y2="732"/>
<rect class="lane-head" x="214.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="289.0" y="24" text-anchor="middle">Follower</text><text class="lane-s" x="289.0" y="40" text-anchor="middle">member</text>
<line class="life" x1="455.0" y1="52" x2="455.0" y2="732"/>
<rect class="lane-head" x="380.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="455.0" y="24" text-anchor="middle">Leader</text><text class="lane-s" x="455.0" y="40" text-anchor="middle">member</text>
<line class="life" x1="621.0" y1="52" x2="621.0" y2="732"/>
<rect class="lane-head" x="546.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="621.0" y="24" text-anchor="middle">Commit worker</text><text class="lane-s" x="621.0" y="40" text-anchor="middle">dgen_transaction</text>
<line class="life" x1="787.0" y1="52" x2="787.0" y2="732"/>
<rect class="lane-head" x="712.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="787.0" y="24" text-anchor="middle">Other followers</text><text class="lane-s" x="787.0" y="40" text-anchor="middle">members</text>
<line class="life" x1="953.0" y1="52" x2="953.0" y2="732"/>
<rect class="lane-head" x="878.0" y="4" width="150" height="46" rx="6"/><text class="lane-n" x="953.0" y="24" text-anchor="middle">Registered pid</text><text class="lane-s" x="953.0" y="40" text-anchor="middle">monitored</text>
<line class="phase-ln" x1="10" y1="92" x2="1040" y2="92"/>
<rect class="phase-bg" x="10" y="83" width="278.2" height="18"/><text class="phase-t" x="16" y="96">EXPLICIT UNREGISTER THROUGH A FOLLOWER</text>
<line class="ln m-call" x1="123.0" y1="128" x2="281.0" y2="128"/>
<circle class="dot m-call" cx="123.0" cy="128" r="3.2"/>
<polygon class="head m-call" points="289.0,128.0 281.0,123.5 281.0,132.5"/>
<text class="lbl m-call" x="206.0" y="121" text-anchor="middle">{unregister, Name}</text>
<circle class="num-dot" cx="18" cy="124.0" r="9"/><text class="num" x="18" y="127.5" text-anchor="middle">1</text>
<rect class="act " x="168.0" y="146" width="242.0" height="40" rx="5"/>
<text class="act-t " x="289.0" y="162" text-anchor="middle">Deletes its own row now and notes the</text>
<text class="act-t " x="289.0" y="177" text-anchor="middle">released pid</text>
<line class="ln m-cast" x1="289.0" y1="212" x2="447.0" y2="212"/>
<polygon class="head m-cast" points="455.0,212.0 447.0,207.5 447.0,216.5"/>
<text class="lbl m-cast" x="372.0" y="205" text-anchor="middle">{unregister_req, Ref, F, Name}</text>
<circle class="num-dot" cx="18" cy="208.0" r="9"/><text class="num" x="18" y="211.5" text-anchor="middle">2</text>
<rect class="act " x="325.0" y="230" width="260.0" height="40" rx="5"/>
<text class="act-t " x="455.0" y="246" text-anchor="middle">Deletes its row. Enqueues {remove, Name,</text>
<text class="act-t " x="455.0" y="261" text-anchor="middle">Pid}.</text>
<line class="ln m-cast" x1="455.0" y1="296" x2="613.0" y2="296"/>
<polygon class="head m-cast" points="621.0,296.0 613.0,291.5 613.0,300.5"/>
<text class="lbl m-cast" x="538.0" y="289" text-anchor="middle">commit batch</text>
<circle class="num-dot" cx="18" cy="292.0" r="9"/><text class="num" x="18" y="295.5" text-anchor="middle">3</text>
<line class="ln m-cast" x1="621.0" y1="330" x2="463.0" y2="330"/>
<polygon class="head m-cast" points="455.0,330.0 463.0,325.5 463.0,334.5"/>
<text class="lbl m-cast" x="538.0" y="323" text-anchor="middle">{committed, V}</text>
<circle class="num-dot" cx="18" cy="326.0" r="9"/><text class="num" x="18" y="329.5" text-anchor="middle">4</text>
<line class="ln m-cast" x1="455.0" y1="364" x2="297.0" y2="364"/>
<line class="ln m-cast" x1="455.0" y1="364" x2="779.0" y2="364"/>
<polygon class="head m-cast" points="289.0,364.0 297.0,359.5 297.0,368.5"/>
<polygon class="head m-cast" points="787.0,364.0 779.0,359.5 779.0,368.5"/>
<text class="lbl m-cast" x="372.0" y="357" text-anchor="middle">{names_batch, [{name_unregistered, Name, Pid}], …}</text>
<circle class="num-dot" cx="18" cy="360.0" r="9"/><text class="num" x="18" y="363.5" text-anchor="middle">5</text>
<line class="ln m-cast accent" x1="455.0" y1="398" x2="297.0" y2="398"/>
<polygon class="head m-cast accent" points="289.0,398.0 297.0,393.5 297.0,402.5"/>
<text class="lbl m-cast accent" x="372.0" y="391" text-anchor="middle">{unregister_reply, Ref}</text>
<circle class="num-dot" cx="18" cy="394.0" r="9"/><text class="num" x="18" y="397.5" text-anchor="middle">6</text>
<line class="ln m-reply" x1="289.0" y1="432" x2="131.0" y2="432"/>
<polygon class="head m-reply" points="123.0,432.0 131.0,427.5 131.0,436.5"/>
<text class="lbl m-reply" x="206.0" y="425" text-anchor="middle">ok</text>
<circle class="num-dot" cx="18" cy="428.0" r="9"/><text class="num" x="18" y="431.5" text-anchor="middle">7</text>
<rect class="note" x="50.0" y="452" width="478.0" height="42" rx="4"/>
<text class="note-t" x="62.0" y="469">With no reachable leader, F answers ok right away and keeps the unregister</text>
<text class="note-t" x="62.0" y="484">as an intent. It sends {retract_req, Name, Pid} once a leader is reachable.</text>
<line class="phase-ln" x1="10" y1="520" x2="1040" y2="520"/>
<rect class="phase-bg" x="10" y="511" width="209.2" height="18"/><text class="phase-t" x="16" y="524">THE REGISTERED PROCESS EXITS</text>
<line class="ln m-signal accent" x1="953.0" y1="556" x2="463.0" y2="556"/>
<polygon class="head m-signal accent" points="455.0,556.0 463.0,551.5 463.0,560.5"/>
<text class="lbl m-signal accent" x="704.0" y="549" text-anchor="middle">{{down, Name}, MRef, process, Pid, Reason}</text>
<circle class="num-dot" cx="18" cy="552.0" r="9"/><text class="num" x="18" y="555.5" text-anchor="middle">8</text>
<rect class="act " x="313.0" y="574" width="284.0" height="40" rx="5"/>
<text class="act-t " x="455.0" y="590" text-anchor="middle">Enqueues {down, Name, MRef}. Skipped if Name</text>
<text class="act-t " x="455.0" y="605" text-anchor="middle">was rebound under a new monitor.</text>
<line class="ln m-cast" x1="455.0" y1="640" x2="613.0" y2="640"/>
<polygon class="head m-cast" points="621.0,640.0 613.0,635.5 613.0,644.5"/>
<text class="lbl m-cast" x="538.0" y="633" text-anchor="middle">commit batch</text>
<circle class="num-dot" cx="18" cy="636.0" r="9"/><text class="num" x="18" y="639.5" text-anchor="middle">9</text>
<line class="ln m-cast" x1="621.0" y1="674" x2="463.0" y2="674"/>
<polygon class="head m-cast" points="455.0,674.0 463.0,669.5 463.0,678.5"/>
<text class="lbl m-cast" x="538.0" y="667" text-anchor="middle">{committed, V}</text>
<circle class="num-dot" cx="18" cy="670.0" r="9"/><text class="num" x="18" y="673.5" text-anchor="middle">10</text>
<line class="ln m-cast" x1="455.0" y1="708" x2="297.0" y2="708"/>
<line class="ln m-cast" x1="455.0" y1="708" x2="779.0" y2="708"/>
<polygon class="head m-cast" points="289.0,708.0 297.0,703.5 297.0,712.5"/>
<polygon class="head m-cast" points="787.0,708.0 779.0,703.5 779.0,712.5"/>
<text class="lbl m-cast" x="372.0" y="701" text-anchor="middle">{names_batch, [{name_unregistered, Name, Pid}], …}</text>
<circle class="num-dot" cx="18" cy="704.0" r="9"/><text class="num" x="18" y="707.5" text-anchor="middle">11</text>
</svg>
