<svg viewBox="0 0 912 698" width="912" role="img" aria-label="A follower holding a yes from epoch E drops it when a snapshot moves it into a later epoch, and sends the registration to the new leader again instead of answering from versions the new leader produced." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--fg:#1a2226;--muted:#5a676d;--rule:#c9d2d5;--lane:#e6ecee;
--accent:#0a6a86;--durable:#8c5a06;--warn:#b0281f;--note:#f8f4e6;--note-rule:#c9b98a}
@media (prefers-color-scheme: dark){:root{--surface:#172024;--fg:#e1e8ea;--muted:#97a5ab;
--rule:#33424a;--lane:#1e2a30;--accent:#56c2df;--durable:#e2ab52;--warn:#ff8074;
--note:#23241d;--note-rule:#6d6440}}
.bg{fill:var(--surface)}
.leg-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;fill:var(--fg)}
.life{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.lane-head{fill:var(--lane);stroke:var(--rule)}
.lane-n{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:13.5px;fill:var(--fg)}
.lane-s,.lbl,.phase-t,.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lane-s{font-size:10.5px;fill:var(--muted)}
.ln{stroke-width:1.4;fill:none}
.lbl{font-size:11px;paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.m-cast,.m-call{stroke:var(--fg);fill:var(--fg)}
.m-reply{stroke:var(--muted);fill:var(--muted)}
.ln.m-reply{stroke-dasharray:5 4}
.m-db{stroke:var(--durable);fill:var(--durable)}
.ln.m-db{stroke-dasharray:1.5 3;stroke-width:1.8;stroke-linecap:round}
.m-signal{stroke:var(--warn);fill:var(--warn)}
.accent{stroke:var(--accent);fill:var(--accent)}
.ln.accent{stroke-width:2.2}
.lbl{stroke:var(--surface)}
.lbl.accent{font-weight:600}
.head,.dot{stroke:none}
.lost{stroke:var(--warn);stroke-width:2;fill:none;stroke-linecap:round}
.act{fill:var(--surface);stroke:var(--rule)}
.act.warn{stroke:var(--warn)}
.act-t,.note-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11.5px;fill:var(--fg)}
.act-t.warn{fill:var(--warn)}
.note{fill:var(--note);stroke:var(--note-rule);stroke-dasharray:4 3}
.note-t{font-style:italic}
.phase-ln{stroke:var(--rule);stroke-width:1}
.phase-bg{fill:var(--surface)}
.phase-t{font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.num-dot{fill:none;stroke:var(--rule)}
.num{font-size:10px;fill:var(--muted)}
</style><rect class="bg" width="100%" height="100%"/>
<line class="life" x1="148.0" y1="52" x2="148.0" y2="692"/>
<rect class="lane-head" x="48.0" y="4" width="200" height="46" rx="6"/><text class="lane-n" x="148.0" y="24" text-anchor="middle">Caller</text><text class="lane-s" x="148.0" y="40" text-anchor="middle">any process</text>
<line class="life" x1="364.0" y1="52" x2="364.0" y2="692"/>
<rect class="lane-head" x="264.0" y="4" width="200" height="46" rx="6"/><text class="lane-n" x="364.0" y="24" text-anchor="middle">Follower</text><text class="lane-s" x="364.0" y="40" text-anchor="middle">member</text>
<line class="life" x1="580.0" y1="52" x2="580.0" y2="692"/>
<rect class="lane-head" x="480.0" y="4" width="200" height="46" rx="6"/><text class="lane-n" x="580.0" y="24" text-anchor="middle">Old leader</text><text class="lane-s" x="580.0" y="40" text-anchor="middle">member</text>
<line class="life" x1="796.0" y1="52" x2="796.0" y2="692"/>
<rect class="lane-head" x="696.0" y="4" width="200" height="46" rx="6"/><text class="lane-n" x="796.0" y="24" text-anchor="middle">New leader</text><text class="lane-s" x="796.0" y="40" text-anchor="middle">member</text>
<line class="ln m-call" x1="148.0" y1="94" x2="356.0" y2="94"/>
<circle class="dot m-call" cx="148.0" cy="94" r="3.2"/>
<polygon class="head m-call" points="364.0,94.0 356.0,89.5 356.0,98.5"/>
<text class="lbl m-call" x="256.0" y="87" text-anchor="middle">{register, Name, Pid, Meta}</text>
<circle class="num-dot" cx="18" cy="90.0" r="9"/><text class="num" x="18" y="93.5" text-anchor="middle">1</text>
<line class="ln m-cast" x1="364.0" y1="128" x2="572.0" y2="128"/>
<polygon class="head m-cast" points="580.0,128.0 572.0,123.5 572.0,132.5"/>
<text class="lbl m-cast" x="472.0" y="121" text-anchor="middle">{register_req, Ref, F, Name, …}</text>
<circle class="num-dot" cx="18" cy="124.0" r="9"/><text class="num" x="18" y="127.5" text-anchor="middle">2</text>
<rect class="act " x="501.0" y="146" width="158.0" height="25" rx="5"/>
<text class="act-t " x="580.0" y="162" text-anchor="middle">Commits at V in epoch E</text>
<line class="ln m-cast" x1="580.0" y1="197" x2="446.1" y2="197"/>
<path class="lost" d="M441.1,192 L451.1,202 M451.1,192 L441.1,202"/>
<text class="lbl m-cast" x="513.0" y="190" text-anchor="middle">{names_batch, …, E, PrevV, V, L0}</text>
<circle class="num-dot" cx="18" cy="193.0" r="9"/><text class="num" x="18" y="196.5" text-anchor="middle">3</text>
<line class="ln m-cast" x1="580.0" y1="231" x2="372.0" y2="231"/>
<polygon class="head m-cast" points="364.0,231.0 372.0,226.5 372.0,235.5"/>
<text class="lbl m-cast" x="472.0" y="224" text-anchor="middle">{register_reply, Ref, yes, V, E}</text>
<circle class="num-dot" cx="18" cy="227.0" r="9"/><text class="num" x="18" y="230.5" text-anchor="middle">4</text>
<rect class="act " x="177.0" y="249" width="374.0" height="40" rx="5"/>
<text class="act-t " x="364.0" y="265" text-anchor="middle">Replica isn&#x27;t at V in E. Holds {awaiting_version, V, E, L0}</text>
<text class="act-t " x="364.0" y="280" text-anchor="middle">and asks for a resync.</text>
<rect class="act warn" x="507.0" y="299" width="146.0" height="25" rx="5"/>
<text class="act-t warn" x="580.0" y="315" text-anchor="middle">Dies before answering</text>
<rect class="note" x="482.0" y="336" width="412.0" height="27" rx="4"/>
<text class="note-t" x="494.0" y="353">N takes over degraded. Its rebuild lacks the commit at V.</text>
<line class="ln m-cast" x1="796.0" y1="391" x2="372.0" y2="391"/>
<polygon class="head m-cast" points="364.0,391.0 372.0,386.5 372.0,395.5"/>
<text class="lbl m-cast" x="580.0" y="384" text-anchor="middle">{apply_names_snapshot, …, E+1, MaxVersion}</text>
<circle class="num-dot" cx="18" cy="387.0" r="9"/><text class="num" x="18" y="390.5" text-anchor="middle">5</text>
<rect class="act " x="183.0" y="409" width="362.0" height="40" rx="5"/>
<text class="act-t " x="364.0" y="425" text-anchor="middle">Its epoch moved past E, so the held yes no longer counts.</text>
<text class="act-t " x="364.0" y="440" text-anchor="middle">The intent goes back to the leader.</text>
<line class="ln m-cast accent" x1="364.0" y1="475" x2="788.0" y2="475"/>
<polygon class="head m-cast accent" points="796.0,475.0 788.0,470.5 788.0,479.5"/>
<text class="lbl m-cast accent" x="580.0" y="468" text-anchor="middle">{register_req, Ref2, F, Name, …}</text>
<circle class="num-dot" cx="18" cy="471.0" r="9"/><text class="num" x="18" y="474.5" text-anchor="middle">6</text>
<rect class="act " x="660.0" y="493" width="248.0" height="25" rx="5"/>
<text class="act-t " x="784.0" y="509" text-anchor="middle">Commits at V2 in epoch E+1, or refuses</text>
<line class="ln m-cast" x1="796.0" y1="544" x2="372.0" y2="544"/>
<polygon class="head m-cast" points="364.0,544.0 372.0,539.5 372.0,548.5"/>
<text class="lbl m-cast" x="580.0" y="537" text-anchor="middle">{names_batch, …, E+1, PrevV, V2, N}</text>
<circle class="num-dot" cx="18" cy="540.0" r="9"/><text class="num" x="18" y="543.5" text-anchor="middle">7</text>
<line class="ln m-cast" x1="796.0" y1="578" x2="372.0" y2="578"/>
<polygon class="head m-cast" points="364.0,578.0 372.0,573.5 372.0,582.5"/>
<text class="lbl m-cast" x="580.0" y="571" text-anchor="middle">{register_reply, Ref2, Result, V2, E+1}</text>
<circle class="num-dot" cx="18" cy="574.0" r="9"/><text class="num" x="18" y="577.5" text-anchor="middle">8</text>
<line class="ln m-reply" x1="364.0" y1="612" x2="156.0" y2="612"/>
<polygon class="head m-reply" points="148.0,612.0 156.0,607.5 156.0,616.5"/>
<text class="lbl m-reply" x="256.0" y="605" text-anchor="middle">Result</text>
<circle class="num-dot" cx="18" cy="608.0" r="9"/><text class="num" x="18" y="611.5" text-anchor="middle">9</text>
<rect class="note" x="50.0" y="632" width="844.0" height="42" rx="4"/>
<text class="note-t" x="62.0" y="649">Before this was fixed, F applied N&#x27;s later-epoch batches and released the old yes once their versions passed V. The caller heard yes for</text>
<text class="note-t" x="62.0" y="664">a binding no live member held.</text>
</svg>
