<svg viewBox="0 0 998 461" width="998" role="img" aria-label="A leader cut off from the cluster keeps trying to commit. The backend rejects its commit because the leader key names a newer leader, and the old leader hands its work back and rejoins." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--fg:#1a2226;--muted:#5a676d;--rule:#c9d2d5;--lane:#e6ecee;
--accent:#0a6a86;--durable:#8c5a06;--warn:#b0281f;--note:#f8f4e6;--note-rule:#c9b98a}
@media (prefers-color-scheme: dark){:root{--surface:#172024;--fg:#e1e8ea;--muted:#97a5ab;
--rule:#33424a;--lane:#1e2a30;--accent:#56c2df;--durable:#e2ab52;--warn:#ff8074;
--note:#23241d;--note-rule:#6d6440}}
.bg{fill:var(--surface)}
.leg-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;fill:var(--fg)}
.life{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.lane-head{fill:var(--lane);stroke:var(--rule)}
.lane-n{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:13.5px;fill:var(--fg)}
.lane-s,.lbl,.phase-t,.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lane-s{font-size:10.5px;fill:var(--muted)}
.ln{stroke-width:1.4;fill:none}
.lbl{font-size:11px;paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.m-cast,.m-call{stroke:var(--fg);fill:var(--fg)}
.m-reply{stroke:var(--muted);fill:var(--muted)}
.ln.m-reply{stroke-dasharray:5 4}
.m-db{stroke:var(--durable);fill:var(--durable)}
.ln.m-db{stroke-dasharray:1.5 3;stroke-width:1.8;stroke-linecap:round}
.m-signal{stroke:var(--warn);fill:var(--warn)}
.accent{stroke:var(--accent);fill:var(--accent)}
.ln.accent{stroke-width:2.2}
.lbl{stroke:var(--surface)}
.lbl.accent{font-weight:600}
.head,.dot{stroke:none}
.lost{stroke:var(--warn);stroke-width:2;fill:none;stroke-linecap:round}
.act{fill:var(--surface);stroke:var(--rule)}
.act.warn{stroke:var(--warn)}
.act-t,.note-t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11.5px;fill:var(--fg)}
.act-t.warn{fill:var(--warn)}
.note{fill:var(--note);stroke:var(--note-rule);stroke-dasharray:4 3}
.note-t{font-style:italic}
.phase-ln{stroke:var(--rule);stroke-width:1}
.phase-bg{fill:var(--surface)}
.phase-t{font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.num-dot{fill:none;stroke:var(--rule)}
.num{font-size:10px;fill:var(--muted)}
</style><rect class="bg" width="100%" height="100%"/>
<line class="life" x1="135.0" y1="52" x2="135.0" y2="455"/>
<rect class="lane-head" x="48.0" y="4" width="174" height="46" rx="6"/><text class="lane-n" x="135.0" y="24" text-anchor="middle">Caller</text><text class="lane-s" x="135.0" y="40" text-anchor="middle">any process</text>
<line class="life" x1="325.0" y1="52" x2="325.0" y2="455"/>
<rect class="lane-head" x="238.0" y="4" width="174" height="46" rx="6"/><text class="lane-n" x="325.0" y="24" text-anchor="middle">Old leader</text><text class="lane-s" x="325.0" y="40" text-anchor="middle">member</text>
<line class="life" x1="515.0" y1="52" x2="515.0" y2="455"/>
<rect class="lane-head" x="428.0" y="4" width="174" height="46" rx="6"/><text class="lane-n" x="515.0" y="24" text-anchor="middle">Commit worker</text><text class="lane-s" x="515.0" y="40" text-anchor="middle">dgen_transaction</text>
<line class="life" x1="705.0" y1="52" x2="705.0" y2="455"/>
<rect class="lane-head" x="618.0" y="4" width="174" height="46" rx="6"/><text class="lane-n" x="705.0" y="24" text-anchor="middle">Backend</text><text class="lane-s" x="705.0" y="40" text-anchor="middle">FDB keys</text>
<line class="life" x1="895.0" y1="52" x2="895.0" y2="455"/>
<rect class="lane-head" x="808.0" y="4" width="174" height="46" rx="6"/><text class="lane-n" x="895.0" y="24" text-anchor="middle">Elector</text><text class="lane-s" x="895.0" y="40" text-anchor="middle">dgen_server</text>
<rect class="note" x="240.0" y="80" width="740.0" height="27" rx="4"/>
<text class="note-t" x="252.0" y="97">L0 is partitioned. The elector has already moved leadership to N at epoch E+1.</text>
<line class="ln m-call" x1="135.0" y1="135" x2="317.0" y2="135"/>
<circle class="dot m-call" cx="135.0" cy="135" r="3.2"/>
<polygon class="head m-call" points="325.0,135.0 317.0,130.5 317.0,139.5"/>
<text class="lbl m-call" x="230.0" y="128" text-anchor="middle">{register, Name, Pid, Meta}</text>
<circle class="num-dot" cx="18" cy="131.0" r="9"/><text class="num" x="18" y="134.5" text-anchor="middle">1</text>
<line class="ln m-cast" x1="325.0" y1="169" x2="507.0" y2="169"/>
<polygon class="head m-cast" points="515.0,169.0 507.0,164.5 507.0,173.5"/>
<text class="lbl m-cast" x="420.0" y="162" text-anchor="middle">commit batch, fenced on {L0, E}</text>
<circle class="num-dot" cx="18" cy="165.0" r="9"/><text class="num" x="18" y="168.5" text-anchor="middle">2</text>
<line class="ln m-db" x1="515.0" y1="203" x2="697.0" y2="203"/>
<polygon class="head m-db" points="705.0,203.0 697.0,198.5 697.0,207.5"/>
<text class="lbl m-db" x="610.0" y="196" text-anchor="middle">check leader key</text>
<circle class="num-dot" cx="18" cy="199.0" r="9"/><text class="num" x="18" y="202.5" text-anchor="middle">3</text>
<line class="ln m-reply accent" x1="705.0" y1="237" x2="523.0" y2="237"/>
<polygon class="head m-reply accent" points="515.0,237.0 523.0,232.5 523.0,241.5"/>
<text class="lbl m-reply accent" x="610.0" y="230" text-anchor="middle">{N, E+1}: conflict</text>
<circle class="num-dot" cx="18" cy="233.0" r="9"/><text class="num" x="18" y="236.5" text-anchor="middle">4</text>
<line class="ln m-cast accent" x1="515.0" y1="271" x2="333.0" y2="271"/>
<polygon class="head m-cast accent" points="325.0,271.0 333.0,266.5 333.0,275.5"/>
<text class="lbl m-cast accent" x="420.0" y="264" text-anchor="middle">{dgen_transaction, Ref, {aborted, fenced}}</text>
<circle class="num-dot" cx="18" cy="267.0" r="9"/><text class="num" x="18" y="270.5" text-anchor="middle">5</text>
<rect class="act " x="171.0" y="289" width="308.0" height="40" rx="5"/>
<text class="act-t " x="325.0" y="305" text-anchor="middle">Retries the ops after 1 s. Once deposed, a local</text>
<text class="act-t " x="325.0" y="320" text-anchor="middle">register becomes an intent.</text>
<line class="ln m-db" x1="325.0" y1="355" x2="887.0" y2="355"/>
<polygon class="head m-db" points="895.0,355.0 887.0,350.5 887.0,359.5"/>
<text class="lbl m-db" x="610.0" y="348" text-anchor="middle">{join, L0, Token, false}</text>
<circle class="num-dot" cx="18" cy="351.0" r="9"/><text class="num" x="18" y="354.5" text-anchor="middle">6</text>
<rect class="act " x="225.0" y="373" width="200.0" height="25" rx="5"/>
<text class="act-t " x="325.0" y="389" text-anchor="middle">Rejoins at most once per epoch</text>
<rect class="note" x="240.0" y="410" width="740.0" height="27" rx="4"/>
<text class="note-t" x="252.0" y="427">N&#x27;s snapshot later moves L0 to follower, and its intents go to N.</text>
</svg>
