SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = TRUE
  Heartbeat = TRUE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
INVARIANTS
  DurableAcked
CONSTRAINT ChanBound
SYMMETRY Symm

\* Both SafeAssume* guards stay TRUE to isolate the degrade-open caveat: this mutation flips only
\* DegradeOpen, so the violation TLC finds is the leader acking a direct
\* registration on the timeout with a single holder — the documented
\* strict_replication = false tradeoff, not the (now fixed) handoff-gather race.

