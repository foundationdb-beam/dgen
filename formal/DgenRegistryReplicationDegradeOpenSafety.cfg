SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = TRUE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  UniqueBinding
  LeaderEpochUnique
CONSTRAINT ChanBound
SYMMETRY Symm

\* The DEFAULT deployment, characterized: strict_replication defaults to false,
\* i.e. production runs the degrade-open policy -- the configuration the
\* DegradeOpen mutation proves loses DurableAcked. This config asks what the
\* default mode STILL guarantees: everything except two-holder durability.
\* Expected to PASS (see check.sh / README for the recorded expectation);
\* a failure here would mean the shipped default breaks uniqueness or prefix
\* consistency, not merely the documented durability caveat.
\* Heartbeat = FALSE for tractability, like the main config: this
\* characterization is about the ack policy, which the heartbeat (an empty
\* batch that acks nothing) does not touch. DgenRegistryReplicationHeartbeat.cfg
\* owns the heartbeat's verification.
