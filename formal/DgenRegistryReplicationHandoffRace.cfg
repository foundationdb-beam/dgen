SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
INVARIANTS
  DurableAcked
  UniqueBinding
CONSTRAINT ChanBound
SYMMETRY Symm

\* Unlike DgenRegistryReplicationNoGuard.cfg / DgenRegistryReplicationDegradeOpen.cfg,
\* this is NOT a mutation of the model to demonstrate what a guard prevents. Every
\* constant here is the current-code setting (VersionGuardedAck = TRUE,
\* DegradeOpen = FALSE). TLC finds a genuine counterexample: a leadership-handoff
\* gather can race an already-in-flight forwarded-registration reply from the
\* crashed former leader, so a version-guarded ack that legitimately fires is
\* later silently erased by a version-blind snapshot overwrite. See
\* formal/README.md "Discovered finding" for the full trace and code references.
