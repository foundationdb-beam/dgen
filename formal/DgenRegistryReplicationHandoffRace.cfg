SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = TRUE
  SafeAssumeGather = FALSE
  SafeAssumeSnap = FALSE
INVARIANTS
  DurableAcked
  UniqueBinding
CONSTRAINT ChanBound
SYMMETRY Symm

\* The pre-fix protocol (both SafeAssume* guards FALSE), same bounds as the main
\* config. This reproduces the originally-discovered handoff-gather race: with
\* the durable-version-key fence on assume and the version-monotonic snapshot
\* apply both disabled, TLC finds a genuine counterexample in which a single
\* node crash silently loses an already-acked registration (DurableAcked).
\* (TLC stops at the first violation, which BFS reaches through DurableAcked;
\* DgenRegistryReplicationHandoffRaceUnique.cfg checks UniqueBinding alone so
\* the re-issue half of the race is demonstrated too.) Every other constant is
\* the shipped default, so this is the pre-fix bug, not an artificial mutation
\* of an unrelated guard. The two *Only configs flip each guard by itself.
