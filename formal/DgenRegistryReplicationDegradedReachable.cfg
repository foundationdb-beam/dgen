SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
  DegradedAssume = TRUE
INVARIANTS
  NoDegradedAssume
CONSTRAINT ChanBound
SYMMETRY Symm

\* NOT a mutation -- a reachability canary, and it must FAIL.  DegradedFlagSound
\* is vacuously true of a model that never assumes degraded; this config asserts
\* that no assume ever is, under DgenRegistryReplicationDegradedAssume.cfg's
\* bounds.  TLC finding a counterexample proves the degraded path is exercised.
