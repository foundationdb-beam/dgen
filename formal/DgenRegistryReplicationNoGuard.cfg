SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = FALSE
  DegradeOpen = FALSE
  SafeAssume = TRUE
INVARIANTS
  UniqueBinding
  DurableAcked
CONSTRAINT ChanBound
SYMMETRY Symm

\* SafeAssume = TRUE isolates the pre-guard (deferred_yes) bug: this mutation
\* flips only VersionGuardedAck, so the violation TLC finds is the follower
\* acking optimistically before its replica applied the row — not the (now
\* fixed) handoff-gather race.

