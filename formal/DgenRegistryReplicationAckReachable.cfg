SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
INVARIANTS
  NoAcks
CONSTRAINT ChanBound
SYMMETRY Symm

\* NOT a mutation -- a reachability canary, and it must FAIL. Every safety
\* invariant in the main config is vacuously satisfied by a protocol that never
\* acks anyone; this config asserts `acked = {}` as an invariant under the main
\* config's exact constants, so TLC's counterexample is machine-checked proof
\* that acks are reachable through the UNMUTATED guards. If this ever passes,
\* the model has gone quiet and every green run above it means much less.
