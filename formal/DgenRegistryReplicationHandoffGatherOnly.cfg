SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = TRUE
  SafeAssumeGather = FALSE
  SafeAssumeSnap = TRUE
INVARIANTS
  DurableAcked
  UniqueBinding
CONSTRAINT ChanBound
SYMMETRY Symm

\* Half-mutation: ONLY the assume-gather's durable-version-key fence is off; the
\* version-monotonic snapshot apply stays on. Expected to FAIL — proving the
\* gather fence is independently necessary, not shadowed by the snapshot guard.
\* (A stale gather still rewinds the assuming leader's OWN replica and the
\* snapshot guard on followers cannot protect the leader from itself.)
