SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
  DegradedAssume = FALSE
  LeaderGoneAssume = TRUE
  EpochFencedAck = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  UniqueBinding
  DurableAcked
  LeaderEpochUnique
  DegradedFlagSound
CONSTRAINT ChanBound
SYMMETRY Symm

\* The gather stops waiting once every live member has handled its old leader's
\* DOWN (LeaderGoneAssume = TRUE), with the plain deadline off. The `degraded` flag
\* stays sound, as in DgenRegistryReplicationDegradedAssume.cfg. Unlike the
\* deadline, this exit also keeps UniqueBinding and DurableAcked. It only fires
\* once nothing more can arrive from the old leader, so a commit it misses was
\* never acked. DgenRegistryReplicationNoEpochFence.cfg shows that this relies on
\* EpochFencedAck. DgenRegistryReplicationLeaderGoneReachable.cfg is the canary
\* proving this exit is actually taken.
