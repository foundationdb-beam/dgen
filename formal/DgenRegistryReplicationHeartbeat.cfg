SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 2
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = TRUE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  UniqueBinding
  DurableAcked
  LeaderEpochUnique
CONSTRAINT ChanBound
SYMMETRY Symm

\* The heartbeat verified with every invariant, at the bounds its mechanism
\* needs: MaxVersion = 2 (one gap to reveal, one commit to race a stale
\* advertisement against) with elections and a crash intact — MaxEpoch = 2 keeps
\* the deposed-but-uninformed leader's stale heartbeat reachable, which is the
\* case whose harmlessness this config exists to CHECK rather than assume.
\* MaxVersion = 3 with heartbeats exceeds 60M distinct states even with
\* NoHbInFlight (see the action's comment), so full depth stays with the main
\* config and the heartbeat gets its own; the mechanism itself — reveal, gap,
\* resync, stale drop — is fully exercised at depth 2.
