SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
  DegradedAssume = FALSE
  LeaderGoneAssume = TRUE
  EpochFencedAck = FALSE
INVARIANTS
  DurableAcked
CONSTRAINT ChanBound
SYMMETRY Symm

\* The pre-fix false ack (EpochFencedAck = FALSE), under the same settings as
\* DgenRegistryReplicationLeaderGoneAssume.cfg, where DurableAcked holds. A
\* follower holds a forwarded `yes` until its replica reaches the commit version.
\* The leader that committed it dies before broadcasting, and the next leader takes
\* over degraded without it. The follower misses the new leader's snapshot, applies
\* its next batch, and releases the held `yes` for a binding nobody holds. MUST FAIL
\* on DurableAcked.
