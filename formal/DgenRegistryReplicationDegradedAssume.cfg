SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
  DegradedAssume = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  LeaderEpochUnique
  DegradedFlagSound
CONSTRAINT ChanBound
SYMMETRY Symm

\* The handoff gather's deadline, modeled: an assume may give up waiting for the
\* durable version key and proceed degraded (DegradedAssume = TRUE), as the code
\* does after ?GATHER_TIMEOUT.  Checks that the `degraded` flag, defined on
\* versions alone (gathered max < durable key), is sound: an assume that did not
\* flag itself adopted exactly the committed map (DegradedFlagSound).
\*
\* UniqueBinding and DurableAcked are deliberately absent: a degraded assume CAN
\* lose a binding — that is what the flag reports, and what §5.6 repairs and
\* `reject_when_degraded` guards.  DgenRegistryReplicationDegradedReachable.cfg
\* is this config's canary: it proves degraded assumes are actually reached.
