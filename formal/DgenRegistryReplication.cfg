SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  SafeAssume = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  UniqueBinding
  DurableAcked
  LeaderEpochUnique
CONSTRAINT ChanBound
SYMMETRY Symm

\* The main model: the FIXED protocol (SafeAssume = TRUE) checked at
\* MaxChanLen = 2 — the channel depth the handoff-gather race needs. All five
\* invariants hold exhaustively (~10.7M distinct states, a couple of minutes).
\* This is the proof the fix closes the race the pre-fix protocol admitted;
\* DgenRegistryReplicationHandoffRace.cfg is the same bounds with SafeAssume =
\* FALSE and fails. See formal/README.md for the fix writeup.
