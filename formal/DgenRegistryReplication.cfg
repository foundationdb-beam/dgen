SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = FALSE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = TRUE
INVARIANTS
  TypeOK
  PrefixConsistency
  UniqueBinding
  DurableAcked
  LeaderEpochUnique
CONSTRAINT ChanBound
SYMMETRY Symm

\* The main model: the FIXED protocol (both SafeAssume* guards TRUE) checked at
\* MaxChanLen = 2 — the channel depth the handoff-gather race needs. All five
\* invariants hold exhaustively. This is the proof the fix closes the race the
\* pre-fix protocol admitted; DgenRegistryReplicationHandoffRace.cfg is the same
\* bounds with both guards FALSE and fails, and the two *Only configs flip each
\* guard alone.
\*
\* Heartbeat = FALSE here, TRUE in DgenRegistryReplicationHeartbeat.cfg at
\* reduced bounds: even limited to one in flight per leader, heartbeats at
\* MaxVersion = 3 multiply the space past 60M distinct states (>45 min on 10
\* cores — unusable per push). The heartbeat's own config keeps every invariant
\* at the bounds its mechanism needs; this one keeps the full-depth commit and
\* handoff interleavings. See formal/README.md.
