SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 1
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
INVARIANTS
  TypeOK
  PrefixConsistency
  LeaderEpochUnique
CONSTRAINT ChanBound
SYMMETRY Symm

\* NOTE: UniqueBinding and DurableAcked are deliberately NOT checked here.
\* TLC found a genuine counterexample at MaxChanLen = 2 (see
\* DgenRegistryReplicationHandoffRace.cfg) — a real race in the shipped
\* protocol, not a modeling artifact. At MaxChanLen = 1 that race is
\* structurally unreachable (it needs two in-flight messages on the same
\* channel), which is *why* it is quiet here — lowering MaxChanLen is the
\* state-explosion remedy the plan prescribes (formal/PLAN.md §11), not a way
\* of hiding the finding. See formal/README.md for the full writeup.
