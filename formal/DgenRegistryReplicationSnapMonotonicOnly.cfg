SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  Members = {m1, m2, m3}
  n1 = n1
  Names = {n1}
  p1 = p1
  p2 = p2
  Pids = {p1, p2}
  NoPid = NoPid
  NoMember = NoMember
  MaxVersion = 3
  MaxEpoch = 2
  MaxCrashes = 1
  MaxChanLen = 2
  VersionGuardedAck = TRUE
  DegradeOpen = FALSE
  Heartbeat = TRUE
  SafeAssumeGather = TRUE
  SafeAssumeSnap = FALSE
INVARIANTS
  DurableAcked
  UniqueBinding
CONSTRAINT ChanBound
SYMMETRY Symm

\* Half-mutation: ONLY the version-monotonic snapshot apply is off; the
\* assume-gather fence stays on. FAILS (DurableAcked, ~1s): even with every
\* gather fenced, a legitimately-sent snapshot delivered LATE — behind a
\* broadcast the follower has since applied — rewinds that follower without the
\* monotonic guard. So each half of the §5.7 fix is independently necessary,
\* which the paired HandoffGatherOnly config proves for the other half.
